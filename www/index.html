<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Station Maintenance Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mute:#5b667a;--line:#d9dee7;--acc:#d6192f;--acc2:#1f4fa3;--ok:#16794c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--mute:#9aa6bd;--line:#2b3956;--acc:#ff4d5f;--acc2:#7aa7ff;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef1f7;--mute:#9aa6bd;--line:#2b3956;--acc:#ff4d5f;--acc2:#7aa7ff;--ok:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
header{padding:18px 16px 16px;background:linear-gradient(120deg,#14213d 0%,#1f4fa3 70%,#d6192f 130%);color:#fff;border-radius:0 0 22px 22px}
h1{margin:0;font-size:21px;letter-spacing:.2px}
header p{margin:2px 0 0;color:#cfd8ee;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border-radius:14px;color:#fff;padding:12px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:30px;line-height:1}.tile span{font-size:12px;opacity:.92}
.bar{height:9px;border-radius:9px;background:var(--bg);overflow:hidden;flex:1;margin:0 8px}.bar i{display:block;height:100%;border-radius:9px}
main{padding:8px 12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px}
button{font:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--acc2);color:#fff;cursor:pointer}
button.main{background:var(--acc);width:100%;margin-top:14px;font-weight:600}
button.wa{background:#1fa855}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 10px;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:1px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.sub{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sub input[type=checkbox]{width:22px;height:22px;flex:none}
.sub span{flex:1}
.sub select{width:auto;padding:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.seg button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.big{font-size:34px;font-weight:700;color:var(--acc);line-height:1}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.log{border-top:1px solid var(--line);padding:10px 0}
.log small{color:var(--mute)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.cnt{font-weight:700;color:var(--acc2)}
details{border-top:1px solid var(--line);padding:8px 0}
summary{font-weight:600;cursor:pointer}
.mini{display:flex;gap:6px;margin-top:6px}.mini input{flex:1}
.empty{color:var(--mute);text-align:center;padding:18px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;border-radius:10px;padding:12px;display:none;justify-content:space-between;align-items:center;gap:8px}
</style></head><body>
<header><h1>Station Maintenance Log</h1><p>Record, review and send maintenance by WhatsApp</p></header>
<main id="app"></main>
<div id="toast"></div>
<nav><button data-tab="log">Log</button><button data-tab="rep">Reports</button><button data-tab="set">Setup</button></nav>
<script src="jspdf.umd.min.js"></script>
<script>
const PAL=['#d6192f','#1f4fa3','#0f9d8a','#f2a007','#7b3fb5','#e8590c','#2b8a3e','#c2255c'];
const AC={'TotalEnergies representative engineer':'#d6192f','Consultant':'#1f4fa3','Contractor':'#f2a007'};
const T={fuel:['Overfill prevention valve','Dipstick','Suction pipes','Siphon pipes','Vent pipes','Check valve','Earthing cable'],oil:['Return pipe','Vent pipe']};
const AUTH=['TotalEnergies representative engineer','Consultant','Contractor'];
const uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mkC=(n,s)=>({id:uid(),name:n,subs:s.map(x=>({id:uid(),name:x}))});
const mkS=n=>({id:uid(),name:n,comps:[mkC('Fuel tank 1',T.fuel),mkC('Oil return tank 1',T.oil),mkC('Oil water separators',[]),mkC('Sanitary drainage system',[]),mkC('Industrial drainage system',[]),mkC('Fire fighting system',[])]});
let S;
try{S=JSON.parse(localStorage.getItem('stm1'))}catch(x){}
if(!S||!S.stations)S={stations:['Haram','Fayoum Road','Zagazig City'].map(mkS),logs:[]};
const save=()=>{try{localStorage.setItem('stm1',JSON.stringify(S))}catch(x){}};
let tab='log',view=1,openSt=null,sel={st:'',c:'',sub:''},lastLog=null;
const st=id=>S.stations.find(s=>s.id===id);
const comp=(s,c)=>s&&s.comps.find(x=>x.id===c);
const fmt=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function opts(list,cur,ph){return (ph?`<option value="">${ph}</option>`:'')+list.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${e(x.name)}</option>`).join('')}
function wa(t){const u='https://wa.me/?text='+encodeURIComponent(t),C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins.Browser){C.Plugins.Browser.open({url:u})}else window.open(u,'_blank')}
function logText(l){const s=st(l.st);return `Maintenance record\nStation: ${l.stn}\nComponent: ${l.cn}\nDate: ${fmt(l.ts)}\nDone by: ${l.by}\nSub-components: ${l.subs.length?l.subs.map(x=>x.name+' ('+x.act+')').join(', '):'-'}\nDescription: ${l.desc}`}
function logHTML(l,showStation,hl){return `<div class="log" style="border-left:5px solid ${AC[l.by]||'#888'};padding-left:10px"><div class="row"><b>${fmt(l.ts)}</b><button class="ghost" data-act="sharelog" data-id="${l.id}">WhatsApp</button></div>
<small>${showStation?e(l.stn)+' · ':''}${e(l.cn)} · ${e(l.by)}</small>
<div>${l.subs.map(x=>`<span class="tag">${e(x.name)}: ${x.act}</span>`).join('')}</div><div>${e(l.desc)}</div></div>`}

function vLog(){
 if(!sel.st||!st(sel.st))sel.st=S.stations[0]?S.stations[0].id:'';
 const s=st(sel.st),c=comp(s,sel.c);
 return `<div class="card"><label>Station</label><select id="fSt">${opts(S.stations,sel.st)}</select>
 <label>Main component</label><select id="fC">${opts(s?s.comps:[],sel.c,'Choose component')}</select>
 ${c?`<label>Sub-components repaired or changed</label>${c.subs.length?c.subs.map(x=>`<div class="sub"><input type="checkbox" class="sk" value="${x.id}" aria-label="${e(x.name)}"><span>${e(x.name)}</span><select class="sa"><option>Repaired</option><option>Changed</option></select></div>`).join(''):'<div class="empty">No sub-components. Add them in Setup, or log on the main component.</div>'}`:''}
 <label>Date and time</label><input type="datetime-local" id="fT" value="${nowLocal()}">
 <label>Done by</label><select id="fB">${AUTH.map(a=>`<option>${a}</option>`).join('')}</select>
 <label>Description</label><textarea id="fD" placeholder="What was done?"></textarea>
 <button class="main" data-act="savelog">Save maintenance</button></div>
 <div class="card"><b>Latest entries</b>${S.logs.slice(-5).reverse().map(l=>logHTML(l,true)).join('')||'<div class="empty">No maintenance recorded yet.</div>'}</div>`}

function filtered(){
 const s=st(sel.st);if(!s)return[];
 return S.logs.filter(l=>l.st===sel.st&&(view<2||l.c===sel.c)&&(view<3||l.subs.some(x=>x.id===sel.sub))).sort((a,b)=>b.ts.localeCompare(a.ts))}
function vRep(){
 if(!sel.st||!st(sel.st))sel.st=S.stations[0]?S.stations[0].id:'';
 const s=st(sel.st),c=comp(s,sel.c);
 if(view>=2&&!c)sel.c=s&&s.comps[0]?s.comps[0].id:'';
 const c2=comp(s,sel.c);
 if(view===3&&(!c2||!c2.subs.find(x=>x.id===sel.sub)))sel.sub=c2&&c2.subs[0]?c2.subs[0].id:'';
 const L=filtered();
 let h=`<div class="seg" style="margin-top:10px">${['Station','Component','Sub-component'].map((n,i)=>`<button data-view="${i+1}" class="${view===i+1?'on':''}">${n}</button>`).join('')}</div>
 <div class="card"><label>Station</label><select id="rSt">${opts(S.stations,sel.st)}</select>
 ${view>=2?`<label>Main component</label><select id="rC">${opts(s?s.comps:[],sel.c)}</select>`:''}
 ${view===3?`<label>Sub-component</label><select id="rS">${opts(c2?c2.subs:[],sel.sub)}</select>`:''}</div>
 `;
 let rp=0,ch=0;L.forEach(l=>l.subs.forEach(x=>{if(view===3&&x.id!==sel.sub)return;x.act==='Repaired'?rp++:ch++}));
 h+=`<div class="tiles"><div class="tile" style="background:linear-gradient(135deg,#d6192f,#ff7a59)"><b>${L.length}</b><span>Records</span></div><div class="tile" style="background:linear-gradient(135deg,#1f4fa3,#4f8cff)"><b>${rp}</b><span>Repaired</span></div><div class="tile" style="background:linear-gradient(135deg,#0f9d8a,#46d3a6)"><b>${ch}</b><span>Changed</span></div></div>
 <div class="row" style="gap:8px;margin:10px 0"><button class="main" style="margin:0" data-act="pdf">Download PDF report</button><button class="wa" style="flex:none" data-act="pdfshare">Share PDF</button></div><div class="card"><b>Maintenance count</b>`;
 const bar=(n,v,mx,i)=>`<div class="row sub"><span style="flex:0 0 38%">${e(n)}</span><div class="bar"><i style="width:${v/mx*100}%;background:${PAL[i%8]}"></i></div><span class="cnt">${v}</span></div>`;
 if(view===1&&s){const a=s.comps.map(x=>[x.name,L.filter(l=>l.c===x.id).length]),mx=Math.max(1,...a.map(z=>z[1]));h+=a.map((z,i)=>bar(z[0],z[1],mx,i)).join('')}
 if(view===2&&c2){const a=c2.subs.map(x=>[x.name,L.filter(l=>l.subs.some(y=>y.id===x.id)).length]),mx=Math.max(1,...a.map(z=>z[1]));h+=a.map((z,i)=>bar(z[0],z[1],mx,i)).join('')}
 h+=`</div><div class="card"><b>History</b>${L.map(l=>logHTML(l,false)).join('')||'<div class="empty">Nothing recorded for this selection.</div>'}</div>`;
 return h}
function repText(){
 const s=st(sel.st),c=comp(s,sel.c),sb=c&&c.subs.find(x=>x.id===sel.sub),L=filtered();
 let t=view===1?`Station report: ${s.name}`:view===2?`Component report: ${s.name} / ${c?c.name:''}`:`Sub-component report: ${s.name} / ${c?c.name:''} / ${sb?sb.name:''}`;
 t+=`\nTotal maintenance: ${L.length}\n`;
 if(view===1)t+=s.comps.map(x=>`- ${x.name}: ${L.filter(l=>l.c===x.id).length}`).join('\n')+'\n';
 return t+'\nHistory:\n'+L.map(l=>`${fmt(l.ts)} | ${view===1?l.cn+' | ':''}${l.by} | ${l.subs.map(x=>x.name+' ('+x.act+')').join(', ')||'-'} | ${l.desc}`).join('\n')}

function vSet(){
 return `<div class="card"><b>Add station</b><div class="mini"><input id="nSt" placeholder="Station name"><button data-act="addst">Add</button></div></div>`+
 S.stations.map(s=>`<div class="card"><details ${openSt===s.id?'open':''} data-sid="${s.id}"><summary>${e(s.name)}</summary>
 ${s.comps.map(c=>`<details style="margin-left:6px"><summary>${e(c.name)} <small>(${c.subs.length})</small></summary>
 ${c.subs.map(x=>`<div class="row sub"><span>${e(x.name)}</span><button class="ghost" data-act="delsub" data-s="${s.id}" data-c="${c.id}" data-id="${x.id}">Remove</button></div>`).join('')}
 <div class="mini"><input id="ns-${c.id}" placeholder="New sub-component"><button data-act="addsub" data-s="${s.id}" data-c="${c.id}">Add</button></div>
 <button class="ghost" style="margin-top:8px" data-act="delcomp" data-s="${s.id}" data-id="${c.id}">Remove ${e(c.name)}</button></details>`).join('')}
 <label>Add main component</label><div class="mini"><input id="nc-${s.id}" placeholder="e.g. Fuel tank 2"><select id="nt-${s.id}" style="width:auto"><option value="">No sub-parts</option><option value="fuel">Fuel tank parts</option><option value="oil">Oil return parts</option></select></div>
 <button class="ghost" style="margin-top:8px" data-act="addcomp" data-s="${s.id}">Add component</button>
 <div><button class="ghost" style="margin-top:12px" data-act="delst" data-id="${s.id}">Remove station</button></div></details></div>`).join('')+
 `<div class="card"><b>Backup</b><p style="color:var(--mute);font-size:13px">Data is saved on this phone only. Send a backup to yourself on WhatsApp now and then.</p><button class="wa" data-act="backup">Send backup</button></div>`}

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 $('app').innerHTML=tab==='log'?vLog():tab==='rep'?vRep():vSet()}
const $=id=>document.getElementById(id);
function toast(msg,fn){const t=$('toast');t.style.display='flex';t.innerHTML=`<span>${msg}</span>`+(fn?'<button class="wa" id="tw" style="background:#fff;color:#14213d">Send on WhatsApp</button>':'');if(fn)$('tw').onclick=fn;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',fn?9000:2200)}

document.addEventListener('change',ev=>{
 const i=ev.target.id;
 if(i==='fSt'){sel.st=ev.target.value;sel.c='';render()}
 else if(i==='fC'){sel.c=ev.target.value;render()}
 else if(i==='rSt'){sel.st=ev.target.value;sel.c='';sel.sub='';render()}
 else if(i==='rC'){sel.c=ev.target.value;sel.sub='';render()}
 else if(i==='rS'){sel.sub=ev.target.value;render()}});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.sid&&d.open)openSt=d.dataset.sid},true);
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();return}
 if(b.dataset.view){view=+b.dataset.view;render();return}
 const a=b.dataset.act,d=b.dataset;if(!a)return;
 if(a==='savelog'){
  const s=st(sel.st),c=comp(s,sel.c),desc=$('fD').value.trim(),t=$('fT').value;
  if(!c)return toast('Choose a main component.');
  if(!desc)return toast('Add a description of the work.');
  const subs=[...document.querySelectorAll('.sub')].filter(r=>r.querySelector('.sk')&&r.querySelector('.sk').checked).map(r=>{const x=c.subs.find(y=>y.id===r.querySelector('.sk').value);return{id:x.id,name:x.name,act:r.querySelector('.sa').value}});
  const l={id:uid(),ts:new Date(t||Date.now()).toISOString(),st:s.id,stn:s.name,c:c.id,cn:c.name,subs,by:$('fB').value,desc};
  S.logs.push(l);save();sel.c='';render();toast('Saved.',()=>wa(logText(l)));return}
 if(a==='sharelog'){const l=S.logs.find(x=>x.id===d.id);if(l)wa(logText(l));return}
 if(a==='pdf'){makePDF(false);return}
 if(a==='pdfshare'){makePDF(true);return}
 if(a==='backup'){wa('Maintenance backup\n'+JSON.stringify(S));return}
 if(a==='addst'){const n=$('nSt').value.trim();if(n){const s=mkS(n);S.stations.push(s);openSt=s.id;save();render()}return}
 if(a==='addcomp'){const n=$('nc-'+d.s).value.trim(),t=$('nt-'+d.s).value;if(n){st(d.s).comps.push(mkC(n,t?T[t]:[]));openSt=d.s;save();render()}return}
 if(a==='addsub'){const n=$('ns-'+d.c).value.trim();if(n){comp(st(d.s),d.c).subs.push({id:uid(),name:n});openSt=d.s;save();render()}return}
 if(a==='delsub'&&confirm('Remove this sub-component? Past records are kept.')){const c=comp(st(d.s),d.c);c.subs=c.subs.filter(x=>x.id!==d.id);openSt=d.s;save();render();return}
 if(a==='delcomp'&&confirm('Remove this component? Past records are kept.')){const s=st(d.s);s.comps=s.comps.filter(x=>x.id!==d.id);openSt=d.s;save();render();return}
 if(a==='delst'&&confirm('Remove this station? Past records are kept.')){S.stations=S.stations.filter(x=>x.id!==d.id);save();render()}});
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function makePDF(share){
 if(!window.jspdf){toast('PDF tool did not load. Connect to the internet and reload.');return}
 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14,CW=W-2*M;
 const s=st(sel.st),c=comp(s,sel.c),sb=c&&c.subs.find(x=>x.id===sel.sub),L=filtered();
 if(!s){toast('Add a station first.');return}
 const fill=h=>doc.setFillColor(...rgb(h)),ink=h=>doc.setTextColor(...rgb(h));
 const kind=view===1?'Station report':view===2?'Component report':'Sub-component report';
 const scope=view===1?s.name:view===2?s.name+'  /  '+(c?c.name:''):s.name+'  /  '+(c?c.name:'')+'  /  '+(sb?sb.name:'');
 const name=(kind+'-'+scope).replace(/[^a-z0-9]+/gi,'-')+'.pdf';
 fill('#14213d');doc.rect(0,0,W,38,'F');fill('#d6192f');doc.rect(0,38,W*0.6,2.5,'F');fill('#1f4fa3');doc.rect(W*0.6,38,W*0.4,2.5,'F');
 ink('#ffffff');doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text(kind,M,17);
 doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(doc.splitTextToSize(scope,CW),M,25);
 doc.setFontSize(8.5);ink('#b9c4dc');doc.text('Generated '+fmt(new Date()),M,34);
 let y=50,rp=0,ch=0;
 L.forEach(l=>l.subs.forEach(x=>{if(view===3&&x.id!==sel.sub)return;x.act==='Repaired'?rp++:ch++}));
 const tw=(CW-8)/3;
 [[L.length,'Maintenance records','#d6192f'],[rp,'Sub-parts repaired','#1f4fa3'],[ch,'Sub-parts changed','#0f9d8a']].forEach((t,i)=>{
  const x=M+i*(tw+4);fill(t[2]);doc.roundedRect(x,y,tw,24,3,3,'F');ink('#ffffff');
  doc.setFont('helvetica','bold');doc.setFontSize(24);doc.text(String(t[0]),x+5,y+13);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(t[1],x+5,y+20)});
 y+=33;
 doc.setFont('helvetica','bold');doc.setFontSize(11);ink('#14213d');doc.text('Done by',M,y);y+=3;
 const ac=['#d6192f','#1f4fa3','#f2a007'];
 AUTH.forEach((a,i)=>{const n=L.filter(l=>l.by===a).length,x=M+i*(tw+4);
  fill('#eef1f7');doc.roundedRect(x,y,tw,14,2,2,'F');fill(ac[i]);doc.rect(x,y,2.2,14,'F');
  ink('#14213d');doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(String(n),x+6,y+9);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text(doc.splitTextToSize(a,tw-17),x+14,y+6)});
 y+=23;
 const bars=view===1?s.comps.map(x=>[x.name,L.filter(l=>l.c===x.id).length]):(view===2&&c)?c.subs.map(x=>[x.name,L.filter(l=>l.subs.some(z=>z.id===x.id)).length]):[];
 if(bars.length){
  doc.setFont('helvetica','bold');doc.setFontSize(11);ink('#14213d');doc.text('Maintenance count',M,y);y+=6;
  const mx=Math.max(1,...bars.map(b=>b[1])),bw=CW-75;
  bars.forEach((b,i)=>{if(y>275){doc.addPage();y=20}
   doc.setFont('helvetica','normal');doc.setFontSize(9);ink('#14213d');doc.text(doc.splitTextToSize(b[0],55)[0],M,y+3.5);
   fill('#eef1f7');doc.roundedRect(M+58,y,bw,5,2.5,2.5,'F');
   if(b[1]){fill(PAL[i%8]);doc.roundedRect(M+58,y,Math.max(5,bw*b[1]/mx),5,2.5,2.5,'F')}
   doc.setFont('helvetica','bold');doc.text(String(b[1]),M+62+bw,y+4);y+=8});
  y+=5}
 if(y>250){doc.addPage();y=20}
 doc.setFont('helvetica','bold');doc.setFontSize(11);ink('#14213d');doc.text('History',M,y);y+=4;

  :[['Date',30,l=>fmt(l.ts)],['Sub-parts',52,l=>l.subs.map(x=>x.name+' ('+x.act+')').join(', ')||'-'],['Done by',30,l=>l.by],['Description',70,l=>l.desc]];
 const thead=()=>{fill('#14213d');doc.rect(M,y,CW,7,'F');ink('#ffffff');doc.setFont('helvetica','bold');doc.setFontSize(8);let x=M;cols.forEach(k=>{doc.text(k[0],x+2.5,y+4.8);x+=k[1]});y+=7};
